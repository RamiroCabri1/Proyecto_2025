<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
    <title>Turn-e | Turnos </title>
    <link rel="icon" type="image/png" href="assets/logo2.png">
</head>

<body>

    <header>
            <a href="./index.html" class="brand">
                <img src="./Assets/logo.png" alt="Turn-e Logo" class="logo-img">
            </a>

        <nav class="header-nav">
            <ul>
                <li><a href="./index.html">Inicio</a></li>
                <li><a href="./clientes-turno.html">Portal clientes</a></li>   
                <li><a href="./login-profesionales.html">Portal Profesionales</a></li>

            </ul>
        </nav>
    </header>

    <main>
        <div class="turno-container">
            <h1>Seleccionar turno</h1>

            <form>
                <div class="form-row">
                    <div class="form-group">
                        <label for="profesional">Profesional</label>
                        <select id="profesional">
                            <option value="">Seleccionar profesional</option>
                            <option value="1">María Pérez - Colorista</option>
                            <option value="2">Juan López - Estilista</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="servicio">Servicio</label>
                        <select id="servicio">
                            <option value="">Seleccionar servicio</option>
                            <option value="corte">Corte</option>
                            <option value="color">Color</option>
                        </select>
                    </div>
                </div>

                <h2>Horarios disponibles</h2>
                <div class="horarios-grid">
                    <button type="button" class="horario">09:00</button>
                    <button type="button" class="horario">09:30</button>
                    <button type="button" class="horario">10:00</button>
                    <button type="button" class="horario">10:30</button>
                    <button type="button" class="horario">11:00</button>
                </div>

                <button type="submit" class="btn reservar">Reservar turno</button>
            </form>
        </div>
    </main>


</body>
</html>
