<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
    <title>Turn-e | Registro Profesionales</title>
    <link rel="icon" type="image/png" href="assets/logo2.png">
</head>

<body>

    <header>
        <a href="./index.html" class="brand">
            <img src="./assets/logo.png" alt="Turn-e Logo" class="logo-img" />
        </a>

        <nav class="header-nav">
            <ul>
                <li><a href="./index.html">Inicio</a></li>
                <li><a href="./clientes-turno.html">Portal Cliente</a></li>
                <li><a href="./login-profesionales.html">Portal Profesionales</a></li>
            </ul>
        </nav>
    </header>

<main class="login-container">
    <h1>Crear Cuenta Profesional</h1>

    <form id="form-registro-profesionales" novalidate>
        
        <div class="form-group">
            <label for="email">E-mail</label>
            <input 
                type="email" 
                id="email" 
                name="email" 
                placeholder="tuemail@ejemplo.com" 
                required
            />
        </div>

        <div class="form-group">
            <label for="password">Contraseña</label>
            <input 
                type="password" 
                id="password" 
                name="password" 
                placeholder="********" 
                required
            />
        </div>

        <div class="form-group">
            <label for="negocio_id">ID del Negocio</label>
            <input 
                type="number" 
                id="negocio_id" 
                name="negocio_id" 
                placeholder="Ej: 1" 
                required
            />
        </div>

        <button type="submit" class="btn">Registrarme</button>

        <p class="note">
            ¿Ya tenés cuenta? <a href="./login-profesionales.html">Iniciar sesión</a>
        </p>

        <p class="error-msg" id="error-message" hidden></p>

    </form>
</main>

<script src="./js/core/api.js"></script>
<script src="./js/profesionales/registro.js"></script>
</body>
</html>
