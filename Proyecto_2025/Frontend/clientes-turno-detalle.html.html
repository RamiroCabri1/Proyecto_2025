<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Turn-e | Detalles de turno </title>
    <link rel="icon" type="image/png" href="assets/logo2.png">

<body>

    <header>
            <a href="./index.html" class="brand">
                <img src="./assets/logo.png" alt="Turn-e Logo" class="logo-img">
            </a>

        <nav class="header-nav">
            <ul>
                <li><a href="./index.html">Inicio</a></li>

<main class="detalle-turno-container">
    <h1>Detalle de tu turno</h1>
    <p>Su número de código es: </p>

    <p class="codigo-turno" id="codigo-turno"> TUR-000123</p>

    <p>Estos son los datos del turno reservado.</p>

    <div class="detalle-card">
        <p><strong>Nombre:</strong> <span id="cliente-nombre">—</span></p>
        <p><strong>Profesional:</strong> <span id="profesional-nombre">—</span></p>
        <p><strong>Servicio:</strong> <span id="servicio-nombre">—</span></p>
        <p><strong>Fecha:</strong> <span id="turno-fecha">—</span></p>
        <p><strong>Horario:</strong> <span id="turno-horario">—</span></p>
        <p><strong>Estado:</strong> <span id="estado-turno">Pendiente</span></p>

    </div>

    <div class="acciones">
        <button class="btn cancelar">Cancelar turno</button>
        <a href="./clientes-turno.html" class="btn volver">Volver</a>
    </div>
</main>

<script src="./js/core/api.js"></script>
