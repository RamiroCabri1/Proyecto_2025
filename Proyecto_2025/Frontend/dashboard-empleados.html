<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turn-e | Dashboard profesionales</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="./assets/logo2.png">

    <link rel="stylesheet" href="./css/dashboard.css">
</head>

<body>

    <header class="topbar">
        <div class="logo-header">
            <img src="./assets/logo.png" alt="Logo Turn-e" />
        </div>

        <div class="top-links">
            <a href="./index.html" class="logout-btn" title="Cerrar sesión">
                <img src="./assets/logout.svg" alt="Cerrar sesión">
            </a>
        </div>
    </header>

    <div class="dashboard-container">

        <aside class="sidebar">
            <h3>Panel</h3>
            <nav>
                <ul>
                    <li><a href="./dashboard-clientes.html"> Clientes</a></li>
                    <li><a href="./dashboard-servicios.html"> Servicios</a></li>
                    <li class="active"><a href="./dashboard-empleados.html"> Empleados</a></li>
                    <li><a href="./dashboard-ajustes.html"> Ajustes</a></li>
                </ul>
            </nav>
        </aside>

        <main class="main-content">
            <input type="hidden" id="negocio_id" />

            <h1>Empleados</h1>

            <div class="acciones-superiores">
                <button id="btn-agregar-empleado" class="btn">+ Agregar empleado</button>
            </div>

            <div class="table-container">
                <table id="tabla-empleados">
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Activo</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody>
                    </tbody>
                </table>
            </div>
    </main>

    </div> 

<!-- Modal agregar empleado -->
<div id="modal-empleado" class="modal">
    <div class="modal-content">
        <span class="close-btn" id="cerrar-modal-empleado">&times;</span>
        <h2>Agregar empleado</h2>

        <form id="form-empleado">
            <div class="form-group">
                <label for="nombre-empleado">Nombre completo</label>
                <input type="text" id="nombre-empleado" name="nombre" required>
            </div>

            <button type="submit" class="btn">Guardar</button>
        </form>
    </div>
</div>

<!-- Modal de confirmación para eliminar empleado -->
<div id="modal-confirmacion" class="modal">
    <div class="modal-content modal-confirm">
        <h2>¿Eliminar empleado?</h2>
        <p>Esta acción no se puede deshacer.</p>

        <div class="modal-actions">
            <button class="btn danger" id="confirmar-eliminar">Eliminar</button>
            <button class="btn" id="cancelar-eliminar">Cancelar</button>
        </div>
    </div>
</div>



<script type="module" src="./js/profesionales/dashboard-empleados.js"></script>

</body>
</html>
