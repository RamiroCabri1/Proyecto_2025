<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turn-e | Dashboard profesionales</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="./Assets/logo2.png">

    <link rel="stylesheet" href="./css/dashboard.css">
</head>

<body>

    <header class="topbar">
        <div class="logo-header">
            <img src="./Assets/logo.png" alt="Logo Turn-e" />
        </div>

        <div class="top-links">
            <a href="#" class="perfil">Perfil</a>
            <a href="./index.html" class="logout-btn" title="Cerrar sesión">
                <img src="./Assets/logout.svg" alt="Cerrar sesión">
            </a>
        </div>
    </header>

    <div class="dashboard-container">

        <aside class="sidebar">
            <h3>Panel</h3>
            <nav>
                <ul>
                    <li><a href="./dashboard-clientes.html"> Clientes</a></li>
                    <li class="active"><a href="./dashboard-servicios.html"> Servicios</a></li>
                    <li><a href="./dashboard-empleados.html"> Empleados</a></li>
                    <li><a href="./dashboard-ajustes.html"> Ajustes</a></li>
                </ul>
            </nav>
        </aside>

        <main class="main-content">
            <input type="hidden" id="negocio_id" />

            <h1>Servicios</h1>

            <div class="acciones-superiores">
                <button id="btn-agregar-servicio" class="btn">+ Agregar servicio</button>
            </div>

            <div class="table-container">
                <table id="tabla-servicios">
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Duración</th>
                            <th>Precio</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody id="servicios-body">
                        <tr>
                            <td>Masaje relajante</td>
                            <td>45 min</td>
                            <td>$8.000</td>
                            <td><a href="#" class="accion-cancelar">Eliminar</a></td>
                        </tr>
                        <tr>
                            <td>Depilación facial</td>
                            <td>30 min</td>
                            <td>$5.000</td>
                            <td><a href="#" class="accion-cancelar">Eliminar</a></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>

    </div>


<!-- Modal para agregar servicio/pruebitaaa, no definitivo-->
<div id="modal-servicio" class="modal">
    <div class="modal-content">
        <span class="close-btn" id="cerrar-modal">&times;</span>
        <h2>Agregar nuevo servicio</h2>

        <form id="form-servicio">
            <div class="form-group">
                <label for="nombre-servicio">Nombre</label>
                <input 
                    type="text" 
                    id="nombre-servicio" 
                    name="nombre" 
                    placeholder="Ej: Masaje relajante" 
                    required
                >
            </div>

            <div class="form-group">
                <label for="descripcion-servicio">Descripción</label>
                    <textarea 
                        id="descripcion-servicio" 
                        name="descripcion" 
                        placeholder="Ej: Sesión de masaje para aliviar el estrés"
                        rows="3" 
                        required
                ></textarea>
            </div>

            <div class="form-group">
                <label for="duracion-servicio">Duración (minutos)</label>
                <input 
                    type="number" 
                    id="duracion-servicio" 
                    name="duracion" 
                    placeholder="Ej: 45"
                    min="10" 
                    max="180" 
                    required
                >
            </div>

            <button type="submit" class="btn">Guardar servicio</button>
        </form>
    </div>
</div>


</body>
</html>
